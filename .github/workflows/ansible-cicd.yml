name: Ansible CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # <- This adds the manual button for prod

jobs:
  # EVERYONE RUNS THIS - Safe, no real servers touched
  lint-and-check:
    name: Lint -> Dry-Run -> Deploy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install ansible ansible-lint yamllint
      - name: Create dummy secrets for CI
        run: |
          cat > ansible-project/roles/mysql/vars/secrets.yml << 'EOF'
          db_name: testdb
          db_user: testuser
          db_password: test123
          EOF
      - name: 1. yamllint
        run: yamllint ansible-project/playbook.yml ansible-project/roles/
      - name: 2. ansible-lint
        run: cd ansible-project && ansible-lint playbook.yml --skip-list var-naming
      - name: 3. shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find ansible-project -name "*.sh" -exec shellcheck {} \; || echo "No shell scripts - OK"
      - name: 4. syntax-check
        run: cd ansible-project && ansible-playbook -i inventory-ci.yml playbook.yml --syntax-check
      - name: 5. check --diff
        run: cd ansible-project && ansible-playbook -i inventory-ci.yml playbook.yml --check --diff
      - name: 6. Pipeline Finished
        run: echo "✅ CI passed - safe to deploy"

  # ONLY RUNS WHEN YOU CLICK THE BUTTON - Real prod
  deploy-to-prod:
    name: Deploy to Production (Manual)
    needs: lint-and-check
    if: github.event_name == 'workflow_dispatch' # <- Won't run on push
    runs-on: ubuntu-latest
    environment: production # <- Add approval in Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ansible
        run: pip install ansible
      - name: Deploy to Prod
        run: |
          echo "This would run: ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass"
          echo "Add your SSH key and vault password as GitHub Secrets to make it real"
          # cd ansible-project && ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
